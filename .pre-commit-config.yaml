default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-check
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy
        language: system
        pass_filenames: false
        files: ^backend/
      - id: eslint
        name: eslint
        entry: pnpm --dir frontend exec eslint
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: prettier
        name: prettier
        entry: pnpm --dir frontend exec prettier --check .
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: tsc
        name: tsc
        entry: pnpm --dir frontend typecheck
        language: system
        pass_filenames: false
        files: ^frontend/

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.22.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]
